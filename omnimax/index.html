<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>OmniMax</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- PWA / "Add to Home Screen" support. Only takes effect when this file
       is opened directly (e.g. in Safari) as the top-level page — a page
       embedded in another site's iframe (like a hosted preview) can't
       control the home-screen icon/name, since the browser reads these
       tags from whatever page is actually at the top of the tab. -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#060a12" />

  <!-- iOS: makes "Add to Home Screen" launch full-screen, no Safari
       chrome, with OmniMax's own icon and name. -->
  <link rel="apple-touch-icon" href="icons/icon-512.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OmniMax" />
</head>
<body>
  <div class="app">

    <!-- ===== Header ===== -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-ring" aria-hidden="true"></span>
        <span class="brand-name">OMNIMAX</span>
        <span class="brand-version" id="brand-version"></span>
      </div>

      <div class="status" id="status-pill">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Standing by</span>
      </div>

      <button class="icon-btn" id="notif-toggle" aria-label="Toggle notifications" title="Notifications">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.7 21a1.999 1.999 0 0 1-3.4 0" />
        </svg>
        <span class="badge" id="notif-badge" hidden>0</span>
      </button>
    </header>

    <div class="body">

      <!-- ===== Notifications / Chats panel ===== -->
      <aside class="panel notif-panel" id="notif-panel">
        <div class="panel-tabs">
          <button class="tab-btn active" id="tab-btn-notifications" data-tab="notifications">Notifications</button>
          <button class="tab-btn" id="tab-btn-chats" data-tab="chats">Chats</button>
        </div>

        <div class="tab-panel" id="tab-notifications">
          <div class="panel-head">
            <h2>Notifications</h2>
            <button class="text-btn" id="notif-clear">Clear all</button>
          </div>

          <ul class="notif-list" id="notif-list">
            <!-- notifications injected here -->
          </ul>

          <form class="reminder-form" id="reminder-form">
            <label for="reminder-text">New reminder</label>
            <div class="reminder-row">
              <input type="text" id="reminder-text" placeholder="Remind me to..." autocomplete="off" />
              <input type="number" id="reminder-minutes" min="0" step="1" value="1" title="Minutes from now" />
              <button type="submit" class="text-btn accent">Set</button>
            </div>
            <p class="hint">Fires as a local, on-device notification only. Nothing is sent anywhere.</p>
          </form>
        </div>

        <div class="tab-panel" id="tab-chats" hidden>
          <div class="panel-head">
            <h2>Tracked chats</h2>
            <button class="text-btn" id="chats-clear">Clear all</button>
          </div>

          <ul class="chat-list" id="chat-list">
            <!-- tracked chats injected here -->
          </ul>

          <form class="chat-form" id="chat-form">
            <label for="chat-title">Track a chat</label>
            <div class="chat-row">
              <select id="chat-platform">
                <option>Claude</option>
                <option>ChatGPT</option>
                <option>Gemini</option>
              </select>
              <input type="text" id="chat-title" placeholder="Title / topic" autocomplete="off" />
            </div>
            <div class="chat-row">
              <input type="url" id="chat-link" placeholder="Link (optional)" autocomplete="off" />
              <button type="submit" class="text-btn accent">Add</button>
            </div>
            <p class="hint">Saved on this device only. Nothing is fetched from these services automatically.</p>
          </form>
        </div>
      </aside>

      <!-- ===== Main console ===== -->
      <main class="console">

        <div class="orb-stage">
          <div class="orb" id="orb">
            <span class="orb-ring r1"></span>
            <span class="orb-ring r2"></span>
            <span class="orb-ring r3"></span>
            <span class="orb-core"></span>
          </div>
          <p class="orb-caption" id="orb-caption">Say "OmniMax" or tap the mic to talk to me.</p>
        </div>

        <div class="thread" id="thread" aria-live="polite">
          <!-- chat messages injected here -->
        </div>

        <form class="composer" id="composer">
          <button type="button" class="mic-btn" id="mic-btn" aria-label="Toggle voice input" title="Voice input">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="9" y="2" width="6" height="12" rx="3" />
              <path d="M5 11a7 7 0 0 0 14 0" />
              <path d="M12 18v4" />
              <path d="M8 22h8" />
            </svg>
          </button>

          <input
            type="text"
            id="composer-input"
            placeholder="Type a command, or use the mic..."
            autocomplete="off"
          />

          <button type="submit" class="send-btn" id="send-btn" aria-label="Send">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 12 20 4 13 20l-2-7-7-1Z" />
            </svg>
          </button>
        </form>

        <div class="options-row">
          <label class="switch">
            <input type="checkbox" id="voice-reply-toggle" checked />
            <span>Speak replies</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="wake-word-toggle" />
            <span>Always listen for "OmniMax"</span>
          </label>
          <label class="lang-picker" for="lang-select">
            <span>Voice language</span>
            <select id="lang-select">
              <option value="auto">Auto (browser)</option>
              <option value="en-US">English</option>
              <option value="bg-BG">Български</option>
            </select>
          </label>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
